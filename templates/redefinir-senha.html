<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - High Flight</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="body-login">

    <a href="{% url 'login' %}" class="back-link">
        <i class="fas fa-arrow-left"></i> Voltar para o Login
    </a>

    <div class="login-container">
        
        <i class="fas fa-key login-icon-avatar"></i>
        
        <h1>Redefinir Senha</h1>
        <p class="login-subtitle">Seu código foi validado. Por favor, crie uma nova senha.</p>

        <div class="login-box">
            
            <form action="{% url 'redefinir_senha' %}" method="POST">
                {% csrf_token %}
                <h4 class="text-center">Crie sua Nova Senha</h4>

                {% if error %}
                    <p class="form-error">{{ error }}</p>
                {% endif %}

                <div class="form-group">
                    <label for="password">Nova Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password_confirm">Confirme a Nova Senha</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password_confirm" name="password_confirm" placeholder="Digite a senha novamente" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-rect btn-full-width">Salvar Nova Senha</button>
            </form>
        </div>
    </div>
    
</body>
</html>
