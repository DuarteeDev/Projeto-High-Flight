<!DOCTYPE html>
<html lang="pt-br">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Código - High Flight</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="body-login">

    <a href="{% url 'login' %}" class="back-link">
        <i class="fas fa-arrow-left"></i> Voltar para o Login
    </a>

    <div class="login-container">
        
        <i class="fas fa-shield-alt login-icon-avatar"></i>
        
        <h1>Quase lá!</h1>
        <p class="login-subtitle">Enviamos um código de 6 dígitos para seu e-mail. Digite-o abaixo.</p>

        <div class="login-box">
            
            <form action="{% url 'validar_codigo' %}" method="POST">
                {% csrf_token %}
                <h4 class="text-center">Validar Código</h4>

                {% if error %}
                    <p class="form-error">{{ error }}</p>
                {% endif %}

                <div class="form-group">
                    <label for="codigo">Código de 6 dígitos</label>
                    <input type="text" id="codigo" name="codigo" placeholder="000000" class="input-codigo-reset" required>
                </div>

                <button type="submit" class="btn btn-primary btn-rect btn-full-width">Validar e Redefinir Senha</button>
            </form>
        </div>
    </div>
    
</body>
</html>
